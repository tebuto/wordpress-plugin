version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: main
    schedule:
      interval: yearly
    open-pull-requests-limit: 10
    assignees:
      - jonasscholl
    groups:
      dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "@wordpress/block-editor"
        update-types: ["version-update:semver-major"]
        # 2026-08-29: left on 16.x — major WP package bump needs coordinated @wordpress/components 40.x migration
      - dependency-name: "@wordpress/components"
        update-types: ["version-update:semver-major"]
        # 2026-08-29: left on 39.x — major WP package bump needs manual block-editor compatibility check

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: yearly
    open-pull-requests-limit: 5
    assignees:
      - JonasScholl
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: yearly
    open-pull-requests-limit: 5
    assignees:
      - jonasscholl
    groups:
      composer:
        patterns:
          - "*"
