sonar.projectKey=tebuto_wordpress-plugin_d85838b5-fae9-48e3-9636-0ec145a330f3

sonar.sources=tebuto-online-terminbuchung

sonar.exclusions=**/node_modules/**,**/block/build/**,**/.svn/**,**/assets-wporg/**,**/assets/**

# WordPress Coding Standards mandate snake_case identifiers and tab indentation,
# which is enforced by PHPCS (`pnpm lint:php`). These Sonar rules require the opposite.
sonar.issue.ignore.multicriteria=wpcsFunctionName,wpcsClassName,wpcsPropertyName,wpcsTabs

sonar.issue.ignore.multicriteria.wpcsFunctionName.ruleKey=php:S100
sonar.issue.ignore.multicriteria.wpcsFunctionName.resourceKey=**/*.php

sonar.issue.ignore.multicriteria.wpcsClassName.ruleKey=php:S101
sonar.issue.ignore.multicriteria.wpcsClassName.resourceKey=**/*.php

sonar.issue.ignore.multicriteria.wpcsPropertyName.ruleKey=php:S116
sonar.issue.ignore.multicriteria.wpcsPropertyName.resourceKey=**/*.php

sonar.issue.ignore.multicriteria.wpcsTabs.ruleKey=php:S105
sonar.issue.ignore.multicriteria.wpcsTabs.resourceKey=**/*.php
